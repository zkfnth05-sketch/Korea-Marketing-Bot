<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aura Live Subtitles Video Chat Simulation (1080x1920)</title>
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
          },
          colors: {
            primary: {
              DEFAULT: '#E5A934',
              hover: '#d49826',
            },
          },
        }
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #050507;
      font-family: 'Pretendard', -apple-system, sans-serif;
      color: #fff;
    }
    /* Luxury Smartphone Frame: 960px x 1820px centered */
    .phone-chassis {
      position: absolute;
      top: 50px;
      left: 60px;
      width: 960px;
      height: 1820px;
      background: #09090b;
      border-radius: 68px;
      padding: 16px;
      box-shadow: 
        0 40px 100px rgba(0, 0, 0, 0.95), 
        0 0 60px rgba(229, 169, 52, 0.2),
        0 0 0 4px #27272a,
        inset 0 0 0 3px rgba(255, 255, 255, 0.12);
    }
    .phone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 54px;
      overflow: hidden;
      background: #000;
    }
    .glass-card {
      background: rgba(0, 0, 0, 0.76);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }
    .glass-pill {
      background: rgba(12, 12, 14, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .glow-gold {
      box-shadow: 0 0 30px rgba(229, 169, 52, 0.5);
    }
    .glow-red {
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.5);
    }
    /* Ripple pulse for calling stage */
    @keyframes ripple {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .ripple-ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(229, 169, 52, 0.6);
      animation: ripple 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    /* Smooth camera breathing */
    @keyframes slow-breath {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }
    .animate-breath {
      animation: slow-breath 6s ease-in-out infinite;
    }
  </style>
</head>

  <!-- Ambient Outer Glows -->
  <div class="absolute w-[800px] h-[800px] rounded-full bg-amber-500/10 blur-[150px] top-10 left-10 pointer-events-none"></div>
  <div class="absolute w-[700px] h-[700px] rounded-full bg-emerald-500/10 blur-[150px] bottom-10 right-10 pointer-events-none"></div>

  <!-- Main Smartphone Chassis -->

        <span class="tracking-tight font-semibold">09:41</span>
        
        <!-- Dynamic Island -->
        <div class="w-44 h-8 bg-black rounded-full flex items-center justify-between px-3 border border-zinc-800/80 shadow-md">
          <div class="w-3 h-3 rounded-full bg-zinc-900 border border-zinc-700"></div>
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>

        <div class="flex items-center gap-2.5 text-lg font-semibold">

            <rect x="0.5" y="0.5" width="20" height="11" rx="3" stroke="currentColor" fill="none"/>

            <path d="M22 4C22.6 4.3 23 4.8 23 5.5C23 6.2 22.6 6.7 22 7V4Z" fill="currentColor"/>

  <!-- Stage Transition Script -->
  <script>
    // Transition from Connecting (Stage 1) to Video Chat (Stage 2) at 1.8s
    setTimeout(() => {
      const s1 = document.getElementById('stage1');
      const s2 = document.getElementById('stage2');
      if (s1 && s2) {
        s1.style.opacity = '0';
        setTimeout(() => {
          s1.style.display = 'none';
          s2.style.opacity = '1';
        }, 350);
      }
    }, 1800);

    // Call duration timer progression
    let sec = 0;
    setInterval(() => {
      sec++;
      const timerEl = document.getElementById('callTimer');
      if (timerEl) {
        timerEl.innerText = '00:' + (sec < 10 ? '0' : '') + sec;
      }
    }, 1000);
  </script>
